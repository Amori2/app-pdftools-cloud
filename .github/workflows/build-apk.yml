name: App Factory APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate 10000-Day Signing Certificate (27+ Years Validity)
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore app/release-key.jks
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=AppFactory,C=US"
          cp ~/.android/debug.keystore app/release-key.jks

      - name: Build APK (10000 Days Validity)
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk com_studio_pdftools.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppFactory-APK
          path: com_studio_pdftools.apk

      - name: Publish Direct Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-1792761162214
          name: "PDF Tools (1.0.0)"
          files: com_studio_pdftools.apk