plugins { id 'com.android.application' }
android {
  namespace 'com.studio.pdftools'
  compileSdk 34
  defaultConfig {
    applicationId "com.studio.pdftools"
    minSdk 23
    targetSdk 34
    versionCode 2
    versionName "2.0.0"
  }
  signingConfigs {
    longTermKey {
      storeFile file("release-key.jks")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }
  buildTypes {
    debug {
      if (file("release-key.jks").exists()) {
        signingConfig signingConfigs.longTermKey
      }
    }
    release {
      minifyEnabled false
      if (file("release-key.jks").exists()) {
        signingConfig signingConfigs.longTermKey
      }
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}
dependencies {}